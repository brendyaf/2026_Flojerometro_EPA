<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Flojerómetro EPA</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- Fuente Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
body{
  min-height:100vh;
  min-height:100dvh;

  background-image:url('img/Fondo-3.png');
  background-size:cover;
  background-position:center -150px;;
  background-repeat:no-repeat;

  overflow-x:hidden;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:28px;

  

}



    /* CARD */

    .login-box{

      position: relative;
      z-index: 5;
      width: 90%;
      max-width: 430px;
      background: white;
      backdrop-filter: blur(10px);
      border-radius: 34px;
      padding: 40px;
      box-shadow:
      0 20px 50px rgba(0,0,0,.08);

    }

    /* LOGO */

    .logo{
      width: 190px;
      display: block;
      margin: auto;
      margin-bottom: 18px;
    }


    /* TITULO */

    .login-title{
      font-size: 2.2rem;
      font-weight: 800;
      color: #241442;
      margin-bottom: 10px;
      justify-content: center;
    }

    .login-text{

      color: #6E6783;
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    /* INPUTS */

    .input-group{
      margin-bottom: 18px;
    }

    .input-group-text{

      background: white;
      border: 1px solid #E4DDF5;
      border-right: 0;
      border-radius: 18px 0 0 18px;
      color: #7C3AED;
      padding-inline: 16px;
    }

    .form-control{

      border: 1px solid #E4DDF5;
      border-left: 0;
      padding: 14px 14px;
      font-size: .97rem;
      color: #2D2347;
      box-shadow: none !important;

    }

    .form-control::placeholder{
      color: #9B94B1;
    }

    .form-control:focus{
      border-color: #2c1293;
    }

    .toggle-password{

      background: white;
      border: 1.5px solid #D8C8FF;
      border-left: none;
      border-radius: 0 18px 18px 0;
      cursor: pointer;

      color: #8A82A4;

      padding-left: 6px;
      padding-right: 14px;

      display: flex;
      align-items: center;

    }
#contraseña{
  border-right: none;
  
}
#correo{
  border-radius: 0 18px 18px 0 !important;
}

.toggle-password:focus{
  box-shadow: none;
}

    /* BOTON */

    .btn-login{

      width: 100%;
      border: none;
      background:
      linear-gradient(135deg,#8B5CF6,#7C3AED);

      color: white;
      font-weight: 700;
      font-size: 1rem;
      padding: 15px;
      border-radius: 18px;
      margin-top: 8px;
      transition: .3s ease;
      box-shadow:
      0 12px 24px rgba(124,58,237,.25);
    }

    .btn-login:hover{

      transform: translateY(-3px);
      background:
      linear-gradient(135deg,#7C3AED,#6D28D9);

    }

    /* LINK */

    .register-text{

      text-align: center;
      margin-top: 22px;
      color: #726A89;
      font-size: .95rem;
    }

    .register-text a{
      text-decoration: none;
      color: #7C3AED;
      font-weight: 700;
    }

    /* CERRAR */

    /* CERRAR */

    .close{

      position:absolute;

      top:20px;
      right:25px;

      font-size:1.5rem;

      color:#9A91B5;

      cursor:pointer;

      transition:.3s;

      text-decoration:none;

    }

    .close:hover{

      color:#7C3AED;

      transform:rotate(90deg);

    }

    /* MENSAJE */

    #mensaje{

      font-size: .92rem;

      margin-top: 14px;

      text-align: center;

    }

    .contenedor-login {
  display: flex;
  justify-content: center; /* Centra horizontalmente */
  align-items: center;     /* Centra verticalmente (opcional) */
}

    /* RESPONSIVE */
@media(max-width:900px){

  body{
    background-position:center;
    padding:24px;
  }

  .login-box{
    max-width:410px;
    padding:34px 28px;
    border-radius:30px;
  }

  .logo{
    width:160px;
  }

  .login-title{
    font-size:1.8rem;
  }

  .login-text{
    font-size:.92rem;
    line-height:1.6;
  }

}

@media(max-width:480px){

  html,
  body{
    min-width:320px;

}
  

  body{
    background:#B78CFF;

}


  .login-box{
    width:100%;
    max-width:340px;
    padding:24px 18px;
    border-radius:24px;
  }

  .logo{
    width:120px;
    margin-bottom:10px;
  }

  .login-title{
    font-size:1.3rem;
    line-height:1.2;
  }

  .login-text{
    font-size:.76rem;
    line-height:1.5;
    margin-bottom:18px;
  }

  .input-group{
    margin-bottom:13px;
  }

  .input-group-text{
    padding-inline:10px;
    border-radius:14px 0 0 14px;
  }

  .form-control{
    font-size:.76rem;
    padding:10px;
  }

  #correo{
    border-radius:0 14px 14px 0 !important;
  }

  .toggle-password{
    border-radius:0 14px 14px 0;
    padding-right:10px;
  }

  .btn-login{
    font-size:.8rem;
    padding:11px;
    border-radius:14px;
  }

  .register-text{
    font-size:.76rem;
  }

  .close{
    top:13px;
    right:17px;
    font-size:1.1rem;
  }

}

  </style>

</head>

<body>


  <!-- LOGIN -->

  <div class="login-box">

    <!-- CERRAR -->

    <a href="#" class="close" onclick="window.history.back(); return false;">
      <i class="fa-solid fa-xmark"></i>
      </a>

    <!-- LOGO -->

    <img 
      src="img/Logo2.png"
      alt="Logo"
      class="logo"
    >


    <!-- TITULO -->

    <div class="contenedor-login">
        <h1 class="login-title">Iniciar sesión</h1>
        </div>

   <p class="login-text" style="text-align: center;">
  Accede a tu cuenta para consultar tus resultados y continuar tu evaluación.
</p>

    <!-- FORM -->

    <form id="loginForm">

      <!-- EMAIL -->

      <div class="input-group">

        <span class="input-group-text">
          <i class="fa-solid fa-envelope"></i>
        </span>

        <input 
          type="email"
          id="correo"
          class="form-control"
          placeholder="Correo electrónico"
          required
        >

      </div>

      <!-- PASSWORD -->

      <div class="input-group">

        <span class="input-group-text">
          <i class="fa-solid fa-lock"></i>
        </span>

        <input 
          type="password"
          id="contraseña"
          class="form-control"
          placeholder="Contraseña"
          required
        >

        <span 
        class="toggle-password"
        id="togglePassword"
        >
        <i class="fa-solid fa-eye-slash"></i>
        </span>

      </div>

      <!-- BOTON -->

      <button type="submit" class="btn btn-login">

        Ingresar

      </button>

      <!-- MENSAJE -->

      <p id="mensaje" class="text-danger"></p>

      <!-- REGISTRO -->

      <div class="register-text">

        ¿No tienes cuenta?

        <a href="/registro.html">
          Regístrate
        </a>

      </div>

    </form>

  </div>

  <!-- SCRIPT -->

<script>

/* VER / OCULTAR */

const passwordInput =
document.getElementById("contraseña");

const togglePassword =
document.getElementById("togglePassword");

const icon =
togglePassword.querySelector("i");

togglePassword.addEventListener("click",()=>{

if(passwordInput.type==="password"){

passwordInput.type="text";

icon.classList.remove("fa-eye-slash");

icon.classList.add("fa-eye");

}else{

passwordInput.type="password";

icon.classList.remove("fa-eye");

icon.classList.add("fa-eye-slash");

}

});


/* LOGIN */

const form =
document.getElementById("loginForm");

const mensaje =
document.getElementById("mensaje");

form.addEventListener("submit",async(e)=>{

e.preventDefault();

const correo =
document.getElementById("correo").value;

const password =
document.getElementById("contraseña").value;

try{

const res =
await fetch("/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({

correo,

password

})

});

const data =
await res.json();

if(!res.ok){

mensaje.innerText =
data.mensaje;

return;

}

/* REDIRECCION */

if(
data.usuario.rol
.toLowerCase()
==="admin"
){

window.location.href=
"/panelAdmin.html";

}else{

window.location.href=
"/";

}

}catch{

mensaje.innerText=
"Error del servidor";

}

});

</script>

</body>
</html>
