<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Evaluación</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- TIPOGRAFÍA INTER -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/estilos.css">
    <style>

#profileBtn{

background:none;
border:none;

padding:0;

width:52px;
height:52px;

display:flex;

align-items:center;
justify-content:center;

cursor:pointer;

}

.profile-icon{

width:52px;
height:52px;

border-radius:50%;

object-fit:cover;

}

@media(max-width:768px){

.profile-icon{

width:44px;
height:44px;

}

}

</style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- =========================
            NAVBAR
    ========================== -->

   <header>

    <img src="img/Logo2.png" class="logo">

    <button id="menuBtn">
        <i class="fa-solid fa-bars"></i>
    </button>

    <nav id="mobileNav">

        <a href="/">Inicio</a>

       <div class="perfil">

<button id="profileBtn" type="button" class="profile-btn">
  <img src="img/Icono-perfil2.png" class="profile-icon" alt="Perfil">
</button>

</div>

    </nav>

</header>

    <!-- =========================
            CONTENIDO
    ========================== -->

    <div class="container evaluacion-container d-flex flex-column align-items-center">

        <!-- CARD -->
        <div class="card tarjeta shadow-sm p-4 position-relative">

           <div class="encabezado-item">

    <!-- REACTIVO -->
    <h2 class="reactivo">
        Enunciado 1
    </h2>

    <!-- AUDIO -->
    <div class="audio-container">

        <span class="audio-label">
            Audio
        </span>

        <button
            class="btn audio-btn"
            onclick="reproducirAudio()"
            title="Aquí puedes escuchar el audio">

            🔊

        </button>

    </div>

</div>

<!-- TEXTO -->
<p class="texto-opcion">

    Selecciona la opción que mejor describa tu comportamiento.

</p>
            <!-- IMAGEN -->
            <img src="img/alarm.png"
                class="img-fluid imagen mx-auto d-block"
                alt="Reloj">

            <h1 class="pregunta">

                Cuando tengo que hacer una tarea,
                normalmente la dejo para el último minuto.

            </h1>

            <!-- AUDIO -->
            <audio id="audioPregunta">

                <source src="audio/index1.m4a"
                    type="audio/mp4">

            </audio>

           

            <!-- OPCIONES -->
            <div class="form-check">

<input
class="form-check-input"
type="radio"
name="respuesta"
id="nunca"
value="1">

<label
class="form-check-label"
for="nunca">

Nunca

</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="respuesta"
id="casiNunca"
value="2">

<label
class="form-check-label"
for="casiNunca">

Casi Nunca

</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="respuesta"
id="aVeces"
value="3">

<label
class="form-check-label"
for="aVeces">

A veces

</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="respuesta"
id="casiSiempre"
value="4">

<label
class="form-check-label"
for="casiSiempre">

Casi siempre

</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="respuesta"
id="siempre"
value="5">

<label
class="form-check-label"
for="siempre">

Siempre

</label>

</div>

        <!-- SIGUIENTE -->
    <div class="botones-navegacion solo-siguiente">

    <a href="#" class="btn-siguiente" onclick="guardarLocal(1,'item2.html')">
    Siguiente
    </a>
        </div>
    </div>

        <!-- =========================
                PROGRESO
        ========================== -->

        <div class="progress-container mt-3">

            <p class="contador">
                1 de 12
            </p>

            <div class="progress">

                <div class="progress-bar progreso"
                    role="progressbar"
                    style="width: 8.3%;">

                </div>

            </div>

        </div>

    </div>

    <!-- MODAL PERFIL -->

<div
id="modalPerfil"
class="modal-evaluacion">

<div class="modal-card">

<button
type="button"
id="cerrarPerfil"
class="modal-close">

<i class="fa-solid fa-xmark"></i>

</button>

<div class="modal-icon">

<i class="fa-solid fa-user"></i>

</div>

<h2 id="nombrePerfil">

Usuario

</h2>

<p id="correoPerfil">

correo

</p>

<p>

Rol:

<strong id="rolPerfil">

usuario

</strong>

</p>

<div class="modal-botones">

<a
href="#"
id="logoutBtn"
class="btn-modal principal">

Cerrar sesión

</a>

</div>

</div>

</div>




    <script>
const menuBtn = document.getElementById('menuBtn');
const mobileNav = document.getElementById('mobileNav');

menuBtn.addEventListener('click', () => {
    mobileNav.classList.toggle('active');
});
</script>
    <script src="js/perfil.js"></script>

    <!-- JS -->
    <script src="js/script.js"></script>

    <!-- BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
